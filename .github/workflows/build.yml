name: Build OpenWrt 25.12.6 for GL-MT5000

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget \
            subversion swig time xsltproc ccache

      - name: Clone source (dmsza 25.12 + MT5000 backport)
        run: |
          git clone --depth 1 -b openwrt-25.12-mt5000 https://github.com/dmsza/openwrt.git openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e files ] && cp -r files openwrt/files || true
          cp .config openwrt/.config
          cd openwrt
          make defconfig

      - name: Download package
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -type f -delete

      - name: Compile the firmware
        run: |
          cd openwrt
          echo "编译开始：$(date)"
          echo "使用 $(nproc) 线程编译"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "编译结束：$(date)"

      - name: Find firmware files
        run: |
          cd openwrt
          find bin/targets -type f -name "*.bin" | tee /tmp/firmware-list.txt
          if [ -s /tmp/firmware-list.txt ]; then
            echo "✅ 固件文件已生成"
            echo "FIRMWARE_FOUND=true" >> $GITHUB_ENV
          else
            echo "❌ 未找到固件文件"
            echo "FIRMWARE_FOUND=false" >> $GITHUB_ENV
          fi

      - name: Upload firmware
        if: env.FIRMWARE_FOUND == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: mt5000-25.12.6-${{ github.run_number }}
          if-no-files-found: error
          path: openwrt/bin/targets/**

      - name: Show help if no firmware
        if: env.FIRMWARE_FOUND == 'false'
        run: |
          echo "❌ 固件编译失败或未生成 .bin 固件文件，请检查编译日志"
